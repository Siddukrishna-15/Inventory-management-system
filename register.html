<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - InventoryHub</title>
<link rel="stylesheet" href="auth-style.css">
</head>
<body>
  <div class="auth-box">
    <h1>📦 Inventory<span>Hub</span></h1>
    <p class="subtitle">Create your account</p>

    <label>Username</label>
    <input type="text" id="username" placeholder="Choose a username">

    <label>Password</label>
    <input type="password" id="password" placeholder="Choose a password">

    <button onclick="register()">Register</button>
    <p class="switch-link">Already have an account? <a href="login.html">Login here</a></p>
    <p id="errorMsg" class="error-msg"></p>
  </div>

<script>
async function register() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');

  if (!username || !password) {
    errorMsg.textContent = 'Please fill both fields';
    return;
  }
  if (password.length < 4) {
    errorMsg.textContent = 'Password must be at least 4 characters';
    return;
  }

  try {
    const res = await fetch('http://localhost:5000/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) {
      errorMsg.textContent = data.message;
      return;
    }

    localStorage.setItem('token', data.token);
    localStorage.setItem('username', data.username);
    window.location.href = 'index.html';
  } catch (err) {
    errorMsg.textContent = 'Server not reachable. Is backend running?';
  }
}
</script>
</body>
</html>
